name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core/ — побайтно сборка тега selfsync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/core-tools
      # Ядро в core/ — не правка руками: исходники и WASM заново собираются из
      # тега, записанного в core/SOURCE, и сравниваются с тем, что в репозитории.
      - run: scripts/core.sh check

  plugin:
    name: Плагин — типы, линт Obsidian, сборка, тесты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      # Как в чистом окружении: без Rust и подмодулей.
      - run: |
          npm ci
          npm run lint
          npm run build
          npm test
