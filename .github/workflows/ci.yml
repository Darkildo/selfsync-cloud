name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plugin:
    name: Плагин — ядро из тега selfsync, типы, линт Obsidian, тесты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # Ядро собирается только из выпущенного тега открытого selfsync.
      - name: core/ стоит на теге
        run: git -C core describe --tags --exact-match
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      # Версия wasm-bindgen-cli обязана совпадать с крейтом в core/Cargo.lock.
      - name: wasm-bindgen и wasm-opt
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' core/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$v" --locked
          sudo apt-get update && sudo apt-get install -y binaryen
      - run: core/scripts/build-wasm.sh
      - run: |
          npm ci
          npm run lint
          npm run build
          npm test
