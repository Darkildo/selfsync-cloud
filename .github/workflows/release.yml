name: Release

# Тег x.y.z (ровно версия из manifest.json, без «v» — так требует каталог плагинов
# Obsidian): main.js, manifest.json и styles.css с аттестацией происхождения, затем
# черновик релиза. Ядро — только из выпущенного тега selfsync: core/ побайтно
# совпадает с его свежей сборкой (scripts/core.sh check).
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Плагин и черновик релиза
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Тег, manifest.json, versions.json и package.json совпадают
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.argv[1];
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const v = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            const bad = [m.version !== tag && "manifest.json", p.version !== tag && "package.json", !(tag in v) && "versions.json"].filter(Boolean);
            if (bad.length) { console.error(`версия ${tag} не совпадает: ${bad.join(", ")}`); process.exit(1); }
          ' "${{ github.ref_name }}"
      - uses: ./.github/actions/core-tools
      - name: core/ — побайтно сборка тега selfsync
        run: scripts/core.sh check
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - run: |
          npm ci
          npm run lint
          npm run build
          npm test
          mkdir -p dist
          # Каталог Obsidian скачивает эти три файла из релиза по отдельности.
          cp main.js manifest.json styles.css dist/
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Черновик релиза
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          read -r _ core commit < core/SOURCE
          gh release create "$TAG" dist/* --draft --verify-tag --title "$TAG" \
            --notes "Built in GitHub Actions from selfsync $core ($commit): core/ is byte-identical to a fresh build of that tag. The files carry a provenance attestation."
